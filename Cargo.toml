[package]
name = "loom2"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_loom2"
crate-type = ["cdylib", "rlib"]

[features]
default = []
mlir = ["dep:melior", "dep:mlir-sys"]
llvm = ["mlir"]

[dependencies]
pyo3 = "0.27.0"
pyo3-stub-gen = { version = "0.23.1", default-features = false }
derive_more = { version = "2.1.1", features = ["display", "from", "into_iterator"] }
indenter = "0.3.4"
smallvec = "1.15.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
melior = { version = "0.28.2", optional = true }
mlir-sys = { version = "230.0.2", optional = true }
enum_dispatch = "0.3.13"

[build-dependencies]
cc = "1"
