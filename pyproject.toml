[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "loom2"
description = "Boolean tensor tracing and syntax-guided synthesis compiler"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module-name = "loom2._loom2"
include = ["loom2/py.typed", "loom2/_loom2.pyi", "benchmark/**/*.py", "benchmark/**/*.sl"]
